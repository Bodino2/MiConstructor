name: MiConstructor CI

on:
  pull_request:
  push:
    branches: [main, "agent/**"]

permissions:
  contents: read

concurrency:
  group: miconstructor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Landing and existing product checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  mobile:
    name: iOS and Android mobile bundles
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
        working-directory: mobile
      - name: Typecheck mobile app
        run: npm run typecheck
        working-directory: mobile
      - name: Bundle Android
        run: npm run bundle:android
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://miconstructor.es
      - name: Bundle iOS
        run: npm run bundle:ios
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://miconstructor.es

  vps-production:
    name: Production API and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: miconstructor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d miconstructor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/miconstructor_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/miconstructor_test
      APP_URL: http://localhost:3200
      SESSION_PEPPER: ssssssssssssssssssssssssssssssss
      TOKEN_PEPPER: tttttttttttttttttttttttttttttttt
      BILLING_JOB_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      ADMIN_EMAIL: admin@miconstructor.es
      REQUIRE_EXTERNAL_SERVICES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vps/package-lock.json
      - run: npm ci
        working-directory: vps
      - run: npm audit --omit=dev --audit-level=high
        working-directory: vps
      - run: npm run check
        working-directory: vps
      - name: Verify compiled production migrator
        run: npm run migrate:prod
        working-directory: vps
      - name: Seed CI administrator for mobile auth smoke test
        run: ADMIN_BOOTSTRAP_PASSWORD='CI-Mobile-Admin-Password-2026' npm run seed:admin
        working-directory: vps
      - name: Verify compiled production server and mobile bearer auth
        working-directory: vps
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/miconstructor-ci-uploads
          mkdir -p /tmp/miconstructor-ci-uploads
          NODE_ENV=production APP_URL=https://miconstructor.es UPLOAD_DIR=/tmp/miconstructor-ci-uploads node dist/src/server.js >/tmp/miconstructor-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3200/health/ready >/tmp/miconstructor-health.json; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/miconstructor-server.log
              exit 1
            fi
            sleep 0.5
          done
          if [ "$ready" != "true" ]; then
            cat /tmp/miconstructor-server.log
            exit 1
          fi
          cat /tmp/miconstructor-health.json

          login_json=$(curl -fsS \
            -H 'Content-Type: application/json' \
            -H 'x-miconstructor-client: mobile' \
            --data '{"email":"admin@miconstructor.es","password":"CI-Mobile-Admin-Password-2026","platform":"android"}' \
            http://127.0.0.1:3200/api/v1/auth/mobile-login)
          token=$(printf '%s' "$login_json" | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).token||""))')
          test "${#token}" -ge 32
          printf '%s' "$login_json" | grep -q '"role":"admin"'

          me_json=$(curl -fsS \
            -H "Authorization: Bearer $token" \
            -H 'x-miconstructor-client: mobile' \
            http://127.0.0.1:3200/api/v1/auth/me)
          printf '%s' "$me_json" | grep -q '"role":"admin"'

          logout_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H 'x-miconstructor-client: mobile' \
            http://127.0.0.1:3200/api/v1/auth/logout)
          test "$logout_code" = "204"
      - name: Verify Node-compatible systemd hardening
        run: |
          ! grep -Eq '^MemoryDenyWriteExecute=(yes|true)$' vps/deploy/miconstructor-api.service
      - name: Assert no internal pricing leaks from the public app
        run: |
          ! grep -R --line-number --extended-regexp '0\.0[345]|percentage|rate' vps/public
