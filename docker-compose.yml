version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nextgen_logistics_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextgen_logistics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nextgen_network

  # Optional: PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nextgen_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nextgen.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - nextgen_network

volumes:
  postgres_data:

networks:
  nextgen_network:
    driver: bridge
