version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: miconstructor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: miconstructor-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://app:app@db:5432/app
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production}
      DISPUTE_WINDOW_DAYS: ${DISPUTE_WINDOW_DAYS:-7}
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: development
    ports:
      - '3001:3001'
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
    command: sh -c "cd apps/api && npx prisma migrate deploy && npx prisma generate && npm run dev"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: miconstructor-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: development
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    command: sh -c "cd apps/web && npm run dev"

volumes:
  postgres_data:
