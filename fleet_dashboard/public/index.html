<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Logistics - Fleet Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>🚚 NextGen Logistics - Fleet Dashboard</h1>
        <p>Real-time truck location tracking</p>
    </div>

    <div class="container">
        <div class="sidebar">
            <h2>Active Trucks</h2>
            <div id="trucks-list" class="trucks-list">
                <p>Loading trucks...</p>
            </div>
            <div class="refresh-btn">
                <button onclick="fetchTrucks()">🔄 Refresh</button>
            </div>
        </div>

        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
